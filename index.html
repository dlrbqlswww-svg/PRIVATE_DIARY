<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>나만의 기록</title>

  <!-- iOS Standalone Web App Meta Settings for iPhone 14 Pro -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="나만의기록">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#000000">

  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"SF Pro Display"', 'Pretendard', 'Helvetica Neue', 'sans-serif'],
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Cropper.js for iOS Touch Image Cropping -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

  <style>
    :root {
      --sat: env(safe-area-inset-top, 47px);
      --sab: env(safe-area-inset-bottom, 34px);
    }
    .pt-safe { padding-top: var(--sat); }
    .pb-safe { padding-bottom: var(--sab); }
    .top-safe { top: var(--sat); }
    .bottom-safe { bottom: var(--sab); }

    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      box-sizing: border-box;
    }
    input, textarea {
      user-select: text;
      -webkit-user-select: text;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .glass-bar {
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
    }

    .aspect-square {
      aspect-ratio: 1 / 1;
    }

    /* Cropper iOS touch refinements */
    .cropper-view-box, .cropper-face {
      border-radius: 12px;
    }
    .cropper-line, .cropper-point {
      background-color: #3b82f6;
    }
    .cropper-modal {
      opacity: 0.8;
      background-color: #000;
    }
  </style>
</head>

<body class="bg-slate-50 dark:bg-black text-slate-800 dark:text-zinc-100 h-full flex flex-col font-sans transition-colors duration-200">

  <div id="pinLockScreen" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-2xl flex flex-col items-center justify-between py-12 px-6 pt-safe pb-safe hidden">
    <div class="pt-8 text-center">
      <div class="w-16 h-16 rounded-full bg-zinc-800/80 border border-zinc-700/60 mx-auto flex items-center justify-center text-zinc-300 text-2xl mb-4 shadow-xl">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2 class="text-xl font-bold tracking-tight text-white">비공개 일기장</h2>
      <p class="text-xs text-zinc-400 mt-1">4자리 암호를 입력해 잠금을 해제하세요</p>
      
      <div class="flex justify-center gap-4 mt-6" id="pinDots">
        <div class="w-3.5 h-3.5 rounded-full border border-zinc-500 transition-all"></div>
        <div class="w-3.5 h-3.5 rounded-full border border-zinc-500 transition-all"></div>
        <div class="w-3.5 h-3.5 rounded-full border border-zinc-500 transition-all"></div>
        <div class="w-3.5 h-3.5 rounded-full border border-zinc-500 transition-all"></div>
      </div>
    </div>

    <div class="w-full max-w-xs grid grid-cols-3 gap-4 text-white text-2xl font-light">
      <button onclick="handleKeypad('1')" class="h-16 w-16 mx-auto rounded-full bg-zinc-800/90 active:bg-zinc-700 flex items-center justify-center transition">1</button>
      <button onclick="handleKeypad('2')" class="h-16 w-16 mx-auto rounded-full bg-zinc-800/90 active:bg-zinc-700 flex items-center justify-center transition">2</button>
      <button onclick="handleKeypad('3')" class="h-16 w-16 mx-auto rounded-full bg-zinc-800/90 active:bg-zinc-700 flex items-center justify-center transition">3</button>
      <button onclick="handleKeypad('4')" class="h-16 w-16 mx-auto rounded-full bg-zinc-800/90 active:bg-zinc-700 flex items-center justify-center transition">4</button>
      <button onclick="handleKeypad('5')" class="h-16 w-16 mx-auto rounded-full bg-zinc-800/90 active:bg-zinc-700 flex items-center justify-center transition">5</button>
      <button onclick="handleKeypad('6')" class="h-16 w-16 mx-auto rounded-full bg-zinc-800/90 active:bg-zinc-700 flex items-center justify-center transition">6</button>
      <button onclick="handleKeypad('7')" class="h-16 w-16 mx-auto rounded-full bg-zinc-800/90 active:bg-zinc-700 flex items-center justify-center transition">7</button>
      <button onclick="handleKeypad('8')" class="h-16 w-16 mx-auto rounded-full bg-zinc-800/90 active:bg-zinc-700 flex items-center justify-center transition">8</button>
      <button onclick="handleKeypad('9')" class="h-16 w-16 mx-auto rounded-full bg-zinc-800/90 active:bg-zinc-700 flex items-center justify-center transition">9</button>
      <button onclick="clearPin()" class="h-16 w-16 mx-auto rounded-full flex items-center justify-center text-sm text-zinc-400 active:text-white">취소</button>
      <button onclick="handleKeypad('0')" class="h-16 w-16 mx-auto rounded-full bg-zinc-800/90 active:bg-zinc-700 flex items-center justify-center transition">0</button>
      <button onclick="backspacePin()" class="h-16 w-16 mx-auto rounded-full flex items-center justify-center text-lg active:text-zinc-400"><i class="fa-solid fa-delete-left"></i></button>
    </div>
    
    <div class="text-[11px] text-zinc-500 flex items-center gap-1.5">
      <i class="fa-solid fa-shield-halved text-emerald-400"></i> 외부 통신 없는 100% 기기 내 로컬 저장
    </div>
  </div>

  <header class="sticky top-0 z-30 pt-safe bg-white/85 dark:bg-black/85 glass-bar border-b border-gray-200/80 dark:border-zinc-800/80 transition-colors">
    <div class="max-w-md mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <h1 class="text-lg font-bold tracking-tight text-slate-900 dark:text-white flex items-center gap-1.5">
          <span>나만의 기록</span>
        </h1>
        <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-semibold bg-emerald-100 text-emerald-800 dark:bg-emerald-950/80 dark:text-emerald-400">
          <i class="fa-solid fa-lock text-[9px] mr-1"></i>로컬
        </span>
      </div>

      <!-- View Switcher (Feed vs Instagram Grid) and Options -->
      <div class="flex items-center gap-1">
        <div class="bg-gray-200/80 dark:bg-zinc-800/80 p-0.5 rounded-lg flex items-center mr-1">
          <button id="viewGridBtn" onclick="setViewMode('grid')" title="인스타그램 그리드 뷰"
            class="w-7 h-7 rounded-md flex items-center justify-center text-xs text-slate-500 dark:text-zinc-400 transition">
            <i class="fa-solid fa-table-cells"></i>
          </button>
          <button id="viewFeedBtn" onclick="setViewMode('feed')" title="피드 리스트 뷰"
            class="w-7 h-7 rounded-md flex items-center justify-center text-xs text-slate-900 dark:text-white bg-white dark:bg-zinc-700 shadow-sm transition">
            <i class="fa-solid fa-bars"></i>
          </button>
        </div>

        <button onclick="toggleTheme()" class="w-8 h-8 rounded-full flex items-center justify-center text-slate-600 dark:text-zinc-400 hover:bg-gray-100 dark:hover:bg-zinc-800 text-sm">
          <i class="fa-solid fa-moon dark:hidden"></i>
          <i class="fa-solid fa-sun hidden dark:inline"></i>
        </button>
        <button onclick="openSettingsModal()" class="w-8 h-8 rounded-full flex items-center justify-center text-slate-600 dark:text-zinc-400 hover:bg-gray-100 dark:hover:bg-zinc-800 text-sm">
          <i class="fa-solid fa-gear"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Search Bar -->
  <div class="max-w-md mx-auto w-full px-4 pt-2.5 pb-1">
    <div class="relative flex items-center">
      <i class="fa-solid fa-magnifying-glass absolute left-3.5 text-slate-400 dark:text-zinc-500 text-xs"></i>
      <input type="text" id="searchInput" oninput="applySearch()" placeholder="기록 검색..." 
        class="w-full bg-gray-200/70 dark:bg-zinc-900 text-sm pl-9 pr-8 py-2 rounded-xl border border-transparent focus:border-blue-500 dark:focus:border-blue-500 focus:outline-none transition">
      <button onclick="clearSearch()" id="clearSearchBtn" class="absolute right-3 text-zinc-400 hover:text-zinc-600 hidden text-xs">
        <i class="fa-solid fa-circle-xmark"></i>
      </button>
    </div>
  </div>

  <main class="flex-1 overflow-y-auto px-3 max-w-md mx-auto w-full pb-32 pt-2">
    <!-- Feed List View Container -->
    <div id="feedViewContainer" class="space-y-3.5"></div>

    <!-- Instagram Profile 3-Column Grid View Container -->
    <div id="gridViewContainer" class="grid grid-cols-3 gap-1 hidden"></div>

    <!-- Empty State -->
    <div id="emptyState" class="py-24 text-center text-slate-400 dark:text-zinc-600 hidden">
      <i class="fa-regular fa-image text-4xl mb-3 opacity-60"></i>
      <p class="text-sm font-medium">작성된 기록이 없습니다</p>
      <p class="text-xs mt-1 text-slate-400 dark:text-zinc-500">하단의 새 글 쓰기 버튼을 눌러 첫 순간을 기록해보세요.</p>
    </div>
  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 z-30 pb-safe bg-white/90 dark:bg-black/90 glass-bar border-t border-gray-200/80 dark:border-zinc-800/80">
    <div class="max-w-md mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-1.5 text-xs text-slate-500 dark:text-zinc-400 font-medium">
        <span id="postCountBadge" class="font-bold text-slate-900 dark:text-white text-sm">0</span>개의 기록
      </div>

      <button onclick="openEditorModal()" class="px-5 py-2.5 rounded-full bg-blue-600 hover:bg-blue-500 active:scale-95 text-white font-medium text-sm shadow-md flex items-center gap-2 transition transform">
        <i class="fa-solid fa-plus text-xs"></i>
        <span>새 글 쓰기</span>
      </button>

      <button onclick="togglePinLockManual()" title="즉시 화면 잠금" class="w-10 h-10 rounded-full flex items-center justify-center text-slate-500 dark:text-zinc-400 active:bg-gray-200 dark:active:bg-zinc-800">
        <i class="fa-solid fa-lock text-sm"></i>
      </button>
    </div>
  </nav>

  <div id="editorModal" class="fixed inset-0 z-40 bg-black/60 backdrop-blur-md hidden flex flex-col justify-end">
    <div class="bg-white dark:bg-zinc-900 w-full max-w-md mx-auto h-[90vh] rounded-t-[32px] flex flex-col overflow-hidden shadow-2xl border-t border-gray-200 dark:border-zinc-800 transition-all">
      
      <!-- Top Action Bar (Safe distance, comfortable touch target) -->
      <div class="px-5 pt-4 pb-3 border-b border-gray-100 dark:border-zinc-800 flex items-center justify-between shrink-0">
        <button type="button" onclick="closeEditorModal()" class="h-10 px-3 -ml-2 rounded-xl flex items-center text-sm font-medium text-slate-500 dark:text-zinc-400 active:text-slate-900 active:bg-gray-100 dark:active:bg-zinc-800 transition">
          취소
        </button>
        <span id="editorModalTitle" class="text-base font-bold text-slate-900 dark:text-white">기록 작성</span>
        <button type="button" onclick="savePost()" class="h-10 px-4 rounded-xl flex items-center text-sm font-semibold text-white bg-blue-600 active:bg-blue-700 shadow-sm transition">
          완료
        </button>
      </div>

      <!-- Editor Scrollable Body -->
      <div class="flex-1 overflow-y-auto p-5 space-y-4">
        <input type="text" id="postTitle" placeholder="제목 (선택)" 
          class="w-full bg-transparent text-lg font-bold text-slate-900 dark:text-white placeholder-slate-400 border-b border-gray-100 dark:border-zinc-800 pb-2 focus:outline-none">

        <textarea id="postContent" rows="7" placeholder="오늘의 생각이나 순간을 자유롭게 적어보세요..."
          class="w-full bg-transparent text-sm leading-relaxed text-slate-800 dark:text-zinc-200 placeholder-slate-400 focus:outline-none resize-none"></textarea>

        <!-- Attached Image Preview Container with Recrop Option -->
        <div id="imagePreviewContainer" class="hidden relative rounded-2xl overflow-hidden border border-gray-200 dark:border-zinc-700">
          <img id="imagePreview" class="w-full max-h-64 object-cover" src="" alt="첨부 이미지">
          <div class="absolute top-2.5 right-2.5 flex items-center gap-1.5">
            <button onclick="reCropAttachedImage()" class="h-8 px-2.5 rounded-full bg-black/75 text-white flex items-center gap-1 text-[11px] backdrop-blur-sm active:scale-95 transition">
              <i class="fa-solid fa-crop-simple"></i> 다시 자르기
            </button>
            <button onclick="removeAttachedImage()" class="w-8 h-8 rounded-full bg-black/75 text-white flex items-center justify-center text-xs backdrop-blur-sm active:scale-90 transition">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
        </div>

        <!-- Add Photo Button & Char count -->
        <div class="pt-3 border-t border-gray-100 dark:border-zinc-800 flex items-center justify-between text-xs text-slate-500 dark:text-zinc-400">
          <label class="cursor-pointer px-3.5 py-2 rounded-xl bg-gray-100 hover:bg-gray-200 dark:bg-zinc-800 dark:hover:bg-zinc-700 font-medium flex items-center gap-2 active:scale-95 transition">
            <i class="fa-regular fa-image text-sm text-blue-500"></i>
            <span class="text-slate-700 dark:text-zinc-300">사진 첨부 (자르기)</span>
            <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageAttach(event)">
          </label>

          <div class="text-xs text-zinc-400" id="charCount">0자</div>
        </div>
      </div>
    </div>
  </div>

  <div id="cropperModal" class="fixed inset-0 z-50 bg-black flex flex-col justify-between pt-safe pb-safe hidden">
    <!-- Cropper Top Bar -->
    <div class="h-14 px-4 flex items-center justify-between border-b border-zinc-800 shrink-0">
      <button onclick="cancelCrop()" class="h-10 px-3 text-sm font-medium text-zinc-300 active:text-white rounded-lg">
        취소
      </button>
      <span class="text-sm font-semibold text-white">사진 자르기 & 편집</span>
      <button onclick="applyCrop()" class="h-10 px-4 bg-blue-600 active:bg-blue-700 text-white text-sm font-semibold rounded-xl shadow">
        자르기 완료
      </button>
    </div>

    <!-- Cropper Canvas Container -->
    <div class="flex-1 w-full relative overflow-hidden bg-black flex items-center justify-center p-2">
      <img id="cropperSourceImage" src="" alt="크롭 대상 이미지" class="max-h-full max-w-full">
    </div>

    <!-- Cropper Bottom Controls (Ratio Presets & Rotate) -->
    <div class="p-4 border-t border-zinc-900 bg-zinc-950 flex flex-col gap-3 shrink-0">
      <!-- Aspect Ratio Selectors -->
      <div class="flex items-center justify-center gap-2 overflow-x-auto no-scrollbar py-1">
        <button onclick="setCropRatio(1, this)" class="crop-ratio-btn px-3.5 py-1.5 rounded-full text-xs font-medium bg-blue-600 text-white transition">
          1:1 (정사각형)
        </button>
        <button onclick="setCropRatio(4/5, this)" class="crop-ratio-btn px-3.5 py-1.5 rounded-full text-xs font-medium bg-zinc-800 text-zinc-300 transition">
          4:5 (세로)
        </button>
        <button onclick="setCropRatio(16/9, this)" class="crop-ratio-btn px-3.5 py-1.5 rounded-full text-xs font-medium bg-zinc-800 text-zinc-300 transition">
          16:9 (와이드)
        </button>
        <button onclick="setCropRatio(NaN, this)" class="crop-ratio-btn px-3.5 py-1.5 rounded-full text-xs font-medium bg-zinc-800 text-zinc-300 transition">
          자유
        </button>
      </div>

      <!-- Action Utilities -->
      <div class="flex items-center justify-center gap-4 text-xs text-zinc-400">
        <button onclick="rotateCropImage(-90)" class="h-9 px-3 rounded-lg bg-zinc-900 active:bg-zinc-800 text-zinc-200 flex items-center gap-1.5">
          <i class="fa-solid fa-rotate-left"></i> 좌회전
        </button>
        <button onclick="rotateCropImage(90)" class="h-9 px-3 rounded-lg bg-zinc-900 active:bg-zinc-800 text-zinc-200 flex items-center gap-1.5">
          <i class="fa-solid fa-rotate-right"></i> 우회전
        </button>
        <button onclick="resetCropImage()" class="h-9 px-3 rounded-lg bg-zinc-900 active:bg-zinc-800 text-zinc-200 flex items-center gap-1.5">
          <i class="fa-solid fa-arrow-rotate-left"></i> 원본 위치
        </button>
      </div>
    </div>
  </div>

  <div id="detailModal" class="fixed inset-0 z-40 bg-black/60 backdrop-blur-md hidden flex flex-col justify-end">
    <div class="bg-white dark:bg-zinc-900 w-full max-w-md mx-auto h-[90vh] rounded-t-[32px] flex flex-col overflow-hidden shadow-2xl border-t border-gray-200 dark:border-zinc-800">
      <div class="px-4 pt-4 pb-3 border-b border-gray-100 dark:border-zinc-800 flex items-center justify-between shrink-0">
        <button onclick="closeDetailModal()" class="h-10 px-3 -ml-2 rounded-xl flex items-center gap-1.5 text-sm font-medium text-blue-600 dark:text-blue-400 active:bg-gray-100 dark:active:bg-zinc-800">
          <i class="fa-solid fa-chevron-left text-xs"></i>
          <span>목록</span>
        </button>
        <span class="text-xs text-slate-400 font-medium" id="detailDate"></span>
        <div class="flex items-center gap-2">
          <button id="detailEditBtn" class="text-xs text-slate-600 dark:text-zinc-400 px-2.5 py-1.5 rounded-lg active:bg-gray-100 dark:active:bg-zinc-800">수정</button>
          <button id="detailDeleteBtn" class="text-xs text-rose-500 px-2.5 py-1.5 rounded-lg active:bg-rose-50 dark:active:bg-rose-950/40">삭제</button>
        </div>
      </div>

      <div class="flex-1 overflow-y-auto p-5 space-y-3" id="detailBodyContent"></div>
    </div>
  </div>

  <div id="settingsModal" class="fixed inset-0 z-40 bg-black/60 backdrop-blur-md hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-zinc-900 w-full max-w-sm rounded-3xl overflow-hidden shadow-2xl border border-gray-200 dark:border-zinc-800">
      <div class="px-5 py-4 border-b border-gray-100 dark:border-zinc-800 flex items-center justify-between">
        <h3 class="font-bold text-slate-900 dark:text-white text-base">설정 및 데이터 백업</h3>
        <button onclick="closeSettingsModal()" class="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
      </div>
      
      <div class="p-5 space-y-4 text-xs">
        <div class="p-3.5 rounded-2xl bg-gray-50 dark:bg-zinc-800/60 border border-gray-200/80 dark:border-zinc-700/60 flex items-center justify-between">
          <div>
            <p class="font-semibold text-slate-800 dark:text-zinc-200 text-sm">앱 잠금 (PIN)</p>
            <p class="text-slate-400 text-[11px] mt-0.5">앱 열 때 4자리 암호 입력</p>
          </div>
          <button onclick="togglePinSetting()" id="pinToggleStatusBtn" class="px-3 py-1.5 rounded-xl bg-slate-200 dark:bg-zinc-700 font-medium active:scale-95 transition">
            설정하기
          </button>
        </div>

        <div>
          <label class="font-semibold block mb-1 text-slate-700 dark:text-zinc-300">데이터 백업 (내보내기)</label>
          <p class="text-slate-400 text-[11px] mb-2">저장된 모든 글과 사진을 JSON 파일로 백업합니다.</p>
          <button onclick="exportBackupData()" class="w-full py-2.5 px-3 rounded-xl bg-slate-100 active:bg-slate-200 dark:bg-zinc-800 dark:active:bg-zinc-700 font-medium text-slate-800 dark:text-zinc-200 flex items-center justify-center gap-2 transition">
            <i class="fa-solid fa-file-export text-blue-500"></i>
            <span>모든 데이터 백업 파일 다운로드</span>
          </button>
        </div>

        <div>
          <label class="font-semibold block mb-1 text-slate-700 dark:text-zinc-300">데이터 복원 (가져오기)</label>
          <p class="text-slate-400 text-[11px] mb-2">이전에 다운로드한 백업 JSON 파일을 불러옵니다.</p>
          <input type="file" id="importFileInput" accept=".json" class="hidden" onchange="importBackupData(event)">
          <button onclick="document.getElementById('importFileInput').click()" class="w-full py-2.5 px-3 rounded-xl bg-slate-100 active:bg-slate-200 dark:bg-zinc-800 dark:active:bg-zinc-700 font-medium text-slate-800 dark:text-zinc-200 flex items-center justify-center gap-2 transition">
            <i class="fa-solid fa-file-import text-emerald-500"></i>
            <span>백업 파일 선택 후 복원</span>
          </button>
        </div>

        <div class="pt-2 border-t border-gray-100 dark:border-zinc-800">
          <button onclick="clearAllDataPrompt()" class="w-full py-2 text-rose-500 active:text-rose-600 text-xs font-semibold text-center">
            모든 기록 영구 삭제
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Custom In-App Notification Toast -->
  <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-full bg-slate-900/90 text-white text-xs shadow-lg backdrop-blur-md transition-all duration-300 opacity-0 pointer-events-none">
    알림 메시지
  </div>

  <script>
    let db = null;
    let posts = [];
    let currentViewMode = 'feed'; // 'feed' or 'grid'
    let currentEditingPostId = null;
    let currentAttachedImageBase64 = null;
    let rawOriginalImageBase64 = null; // Stored to allow re-cropping
    let enteredPin = "";
    let cropperInstance = null;

    const PIN_KEY = 'privatelog_user_pin';
    const THEME_KEY = 'privatelog_theme';
    const VIEW_KEY = 'privatelog_view_mode';

    /* Database Initialization */
    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open("PrivateMicroBlogDB", 2);
        request.onupgradeneeded = (e) => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains("posts")) {
            const store = database.createObjectStore("posts", { keyPath: "id" });
            store.createIndex("createdAt", "createdAt", { unique: false });
          }
        };
        request.onsuccess = (e) => {
          db = e.target.result;
          resolve(db);
        };
        request.onerror = (e) => reject(e);
      });
    }

    async function fetchAllPostsFromDB() {
      return new Promise((resolve) => {
        const tx = db.transaction("posts", "readonly");
        const store = tx.objectStore("posts");
        const request = store.getAll();
        request.onsuccess = () => {
          let list = request.result || [];
          list.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
          resolve(list);
        };
        request.onerror = () => resolve([]);
      });
    }

    async function savePostToDB(post) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction("posts", "readwrite");
        const store = tx.objectStore("posts");
        const req = store.put(post);
        req.onsuccess = () => resolve();
        req.onerror = (e) => reject(e);
      });
    }

    async function deletePostFromDB(id) {
      return new Promise((resolve) => {
        const tx = db.transaction("posts", "readwrite");
        const store = tx.objectStore("posts");
        store.delete(id);
        tx.oncomplete = () => resolve();
      });
    }

    function handleImageAttach(event) {
      const file = event.target.files[0];
      if (!file) return;

      if (file.size > 15 * 1024 * 1024) {
        showToast("사진은 최대 15MB까지 가능합니다");
        return;
      }

      const reader = new FileReader();
      reader.onload = (e) => {
        rawOriginalImageBase64 = e.target.result;
        openCropperModal(rawOriginalImageBase64);
      };
      reader.readAsDataURL(file);
    }

    function openCropperModal(imageSrc) {
      const modal = document.getElementById('cropperModal');
      const imageEl = document.getElementById('cropperSourceImage');
      
      imageEl.src = imageSrc;
      modal.classList.remove('hidden');

      if (cropperInstance) {
        cropperInstance.destroy();
      }

      // Initialize Cropper with touch-friendly default 1:1 ratio
      cropperInstance = new Cropper(imageEl, {
        aspectRatio: 1, // Default 1:1 Square (Instagram aesthetic)
        viewMode: 1,
        dragMode: 'move',
        autoCropArea: 0.9,
        restore: false,
        guides: true,
        center: true,
        highlight: false,
        cropBoxMovable: true,
        cropBoxResizable: true,
        toggleDragModeOnDblclick: false,
        background: false,
      });

      // Reset ratio buttons style to 1:1
      const ratioButtons = document.querySelectorAll('.crop-ratio-btn');
      ratioButtons.forEach((btn, idx) => {
        if (idx === 0) {
          btn.className = "crop-ratio-btn px-3.5 py-1.5 rounded-full text-xs font-medium bg-blue-600 text-white transition";
        } else {
          btn.className = "crop-ratio-btn px-3.5 py-1.5 rounded-full text-xs font-medium bg-zinc-800 text-zinc-300 transition";
        }
      });
    }

    function setCropRatio(ratio, buttonEl) {
      if (!cropperInstance) return;
      cropperInstance.setAspectRatio(ratio);

      const ratioButtons = document.querySelectorAll('.crop-ratio-btn');
      ratioButtons.forEach(btn => {
        btn.className = "crop-ratio-btn px-3.5 py-1.5 rounded-full text-xs font-medium bg-zinc-800 text-zinc-300 transition";
      });
      if (buttonEl) {
        buttonEl.className = "crop-ratio-btn px-3.5 py-1.5 rounded-full text-xs font-medium bg-blue-600 text-white transition";
      }
    }

    function rotateCropImage(degree) {
      if (cropperInstance) {
        cropperInstance.rotate(degree);
      }
    }

    function resetCropImage() {
      if (cropperInstance) {
        cropperInstance.reset();
      }
    }

    function cancelCrop() {
      if (cropperInstance) {
        cropperInstance.destroy();
        cropperInstance = null;
      }
      document.getElementById('cropperModal').classList.add('hidden');
      document.getElementById('imageInput').value = "";
    }

    function applyCrop() {
      if (!cropperInstance) return;

      // Render cropped image to canvas with balanced resolution & compression
      const croppedCanvas = cropperInstance.getCroppedCanvas({
        maxWidth: 1600,
        maxHeight: 1600,
        fillColor: '#ffffff',
        imageSmoothingEnabled: true,
        imageSmoothingQuality: 'high',
      });

      if (!croppedCanvas) {
        showToast("사진 자르기에 실패했습니다");
        return;
      }

      currentAttachedImageBase64 = croppedCanvas.toDataURL('image/jpeg', 0.85);

      document.getElementById('imagePreview').src = currentAttachedImageBase64;
      document.getElementById('imagePreviewContainer').classList.remove('hidden');

      cancelCrop(); // Close modal and destroy cropper instance
    }

    function reCropAttachedImage() {
      if (rawOriginalImageBase64) {
        openCropperModal(rawOriginalImageBase64);
      } else if (currentAttachedImageBase64) {
        openCropperModal(currentAttachedImageBase64);
      }
    }

    function removeAttachedImage() {
      currentAttachedImageBase64 = null;
      rawOriginalImageBase64 = null;
      document.getElementById('imageInput').value = "";
      document.getElementById('imagePreviewContainer').classList.add('hidden');
    }

    function setViewMode(mode) {
      currentViewMode = mode;
      localStorage.setItem(VIEW_KEY, mode);

      const feedBtn = document.getElementById('viewFeedBtn');
      const gridBtn = document.getElementById('viewGridBtn');
      const feedContainer = document.getElementById('feedViewContainer');
      const gridContainer = document.getElementById('gridViewContainer');

      if (mode === 'grid') {
        gridBtn.className = "w-7 h-7 rounded-md flex items-center justify-center text-xs text-slate-900 dark:text-white bg-white dark:bg-zinc-700 shadow-sm transition";
        feedBtn.className = "w-7 h-7 rounded-md flex items-center justify-center text-xs text-slate-500 dark:text-zinc-400 transition";
        feedContainer.classList.add('hidden');
        gridContainer.classList.remove('hidden');
      } else {
        feedBtn.className = "w-7 h-7 rounded-md flex items-center justify-center text-xs text-slate-900 dark:text-white bg-white dark:bg-zinc-700 shadow-sm transition";
        gridBtn.className = "w-7 h-7 rounded-md flex items-center justify-center text-xs text-slate-500 dark:text-zinc-400 transition";
        gridContainer.classList.add('hidden');
        feedContainer.classList.remove('hidden');
      }

      renderPosts();
    }

    function renderPosts() {
      const feedContainer = document.getElementById('feedViewContainer');
      const gridContainer = document.getElementById('gridViewContainer');
      const emptyState = document.getElementById('emptyState');
      const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();

      let filtered = posts.filter(post => {
        if (searchVal) {
          const matchTitle = (post.title || '').toLowerCase().includes(searchVal);
          const matchContent = (post.content || '').toLowerCase().includes(searchVal);
          return matchTitle || matchContent;
        }
        return true;
      });

      document.getElementById('postCountBadge').textContent = posts.length;

      if (filtered.length === 0) {
        feedContainer.innerHTML = "";
        gridContainer.innerHTML = "";
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      if (currentViewMode === 'feed') {
        feedContainer.innerHTML = filtered.map(post => {
          const dateStr = formatDate(post.createdAt);
          const htmlContent = marked.parse(post.content || '');

          return `
            <article class="bg-white dark:bg-zinc-900 border border-gray-200/80 dark:border-zinc-800/80 rounded-2xl p-4 shadow-sm transition">
              <div class="flex items-center justify-between text-[11px] text-slate-400 mb-2">
                <time>${dateStr}</time>
                <div class="flex items-center gap-3">
                  <button onclick="editPost('${post.id}')" class="hover:text-blue-500"><i class="fa-regular fa-pen-to-square"></i></button>
                  <button onclick="deletePost('${post.id}')" class="hover:text-rose-500"><i class="fa-regular fa-trash-can"></i></button>
                </div>
              </div>

              ${post.title ? `<h3 class="text-base font-bold text-slate-900 dark:text-white mb-2">${escapeHtml(post.title)}</h3>` : ''}

              <div class="text-slate-700 dark:text-zinc-300 text-sm leading-relaxed mb-3 break-words">
                ${htmlContent}
              </div>

              ${post.image ? `
                <div class="rounded-xl overflow-hidden border border-gray-100 dark:border-zinc-800">
                  <img src="${post.image}" alt="사진" class="w-full max-h-80 object-cover" loading="lazy">
                </div>
              ` : ''}
            </article>
          `;
        }).join('');
      } else {
        // Instagram Profile 3-Column Grid
        gridContainer.innerHTML = filtered.map(post => {
          if (post.image) {
            return `
              <div onclick="openDetailModal('${post.id}')" class="aspect-square relative overflow-hidden bg-zinc-800 cursor-pointer active:opacity-80 transition rounded-sm">
                <img src="${post.image}" alt="썸네일" class="w-full h-full object-cover">
                ${post.title ? `<div class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/75 to-transparent p-1.5 text-[10px] text-white font-medium truncate">${escapeHtml(post.title)}</div>` : ''}
              </div>
            `;
          } else {
            return `
              <div onclick="openDetailModal('${post.id}')" class="aspect-square relative overflow-hidden p-2.5 bg-gradient-to-br from-slate-100 to-slate-200 dark:from-zinc-800 dark:to-zinc-900 cursor-pointer active:opacity-80 transition rounded-sm flex flex-col justify-between border border-gray-200/50 dark:border-zinc-800/50">
                <p class="text-[11px] font-semibold text-slate-800 dark:text-zinc-200 line-clamp-3 leading-snug">
                  ${escapeHtml(post.title || post.content || '기록')}
                </p>
                <span class="text-[9px] text-slate-400 dark:text-zinc-500">${formatDateShort(post.createdAt)}</span>
              </div>
            `;
          }
        }).join('');
      }
    }

    function openDetailModal(id) {
      const post = posts.find(p => p.id === id);
      if (!post) return;

      document.getElementById('detailDate').textContent = formatDate(post.createdAt);
      const container = document.getElementById('detailBodyContent');
      const htmlContent = marked.parse(post.content || '');

      container.innerHTML = `
        ${post.image ? `
          <div class="rounded-2xl overflow-hidden border border-gray-100 dark:border-zinc-800 mb-4">
            <img src="${post.image}" alt="사진" class="w-full max-h-96 object-cover">
          </div>
        ` : ''}
        ${post.title ? `<h2 class="text-lg font-bold text-slate-900 dark:text-white mb-2">${escapeHtml(post.title)}</h2>` : ''}
        <div class="text-slate-800 dark:text-zinc-200 text-sm leading-relaxed">${htmlContent}</div>
      `;

      document.getElementById('detailEditBtn').onclick = () => {
        closeDetailModal();
        editPost(id);
      };
      document.getElementById('detailDeleteBtn').onclick = () => {
        closeDetailModal();
        deletePost(id);
      };

      document.getElementById('detailModal').classList.remove('hidden');
    }

    function closeDetailModal() {
      document.getElementById('detailModal').classList.add('hidden');
    }

    function openEditorModal(isEdit = false) {
      document.getElementById('editorModal').classList.remove('hidden');
      if (!isEdit) {
        currentEditingPostId = null;
        document.getElementById('editorModalTitle').textContent = "새 기록 남기기";
        document.getElementById('postTitle').value = "";
        document.getElementById('postContent').value = "";
        removeAttachedImage();
      }
      updateCharCount();
    }

    function closeEditorModal() {
      document.getElementById('editorModal').classList.add('hidden');
    }

    async function savePost() {
      const content = document.getElementById('postContent').value.trim();
      const title = document.getElementById('postTitle').value.trim();

      if (!content && !title && !currentAttachedImageBase64) {
        showToast("내용이나 사진을 입력해주세요");
        return;
      }

      const now = new Date().toISOString();

      if (currentEditingPostId) {
        const target = posts.find(p => p.id === currentEditingPostId);
        if (target) {
          target.title = title;
          target.content = content;
          target.image = currentAttachedImageBase64;
          target.rawImage = rawOriginalImageBase64 || target.rawImage;
          target.updatedAt = now;
          await savePostToDB(target);
          showToast("기록이 수정되었습니다");
        }
      } else {
        const newPost = {
          id: "post_" + Date.now() + "_" + Math.random().toString(36).substring(2, 7),
          title: title,
          content: content,
          image: currentAttachedImageBase64,
          rawImage: rawOriginalImageBase64,
          createdAt: now,
          updatedAt: now
        };
        await savePostToDB(newPost);
        showToast("새 기록이 저장되었습니다");
      }

      closeEditorModal();
      posts = await fetchAllPostsFromDB();
      renderPosts();
    }

    function editPost(id) {
      const post = posts.find(p => p.id === id);
      if (!post) return;
      currentEditingPostId = id;
      openEditorModal(true);
      document.getElementById('editorModalTitle').textContent = "기록 수정";
      document.getElementById('postTitle').value = post.title || '';
      document.getElementById('postContent').value = post.content || '';
      
      if (post.image) {
        currentAttachedImageBase64 = post.image;
        rawOriginalImageBase64 = post.rawImage || post.image;
        document.getElementById('imagePreview').src = post.image;
        document.getElementById('imagePreviewContainer').classList.remove('hidden');
      } else {
        removeAttachedImage();
      }
      updateCharCount();
    }

    async function deletePost(id) {
      if (window.confirm("이 기록을 삭제하시겠습니까?")) {
        await deletePostFromDB(id);
        posts = await fetchAllPostsFromDB();
        renderPosts();
        showToast("기록이 삭제되었습니다");
      }
    }

    function applySearch() {
      const val = document.getElementById('searchInput').value;
      document.getElementById('clearSearchBtn').classList.toggle('hidden', val.length === 0);
      renderPosts();
    }

    function clearSearch() {
      document.getElementById('searchInput').value = "";
      document.getElementById('clearSearchBtn').classList.add('hidden');
      renderPosts();
    }

    function checkPinOnLaunch() {
      const savedPin = localStorage.getItem(PIN_KEY);
      if (savedPin) {
        document.getElementById('pinLockScreen').classList.remove('hidden');
      }
      updatePinSettingsButtonLabel();
    }

    function handleKeypad(digit) {
      if (enteredPin.length < 4) {
        enteredPin += digit;
        updatePinDots();
        if (enteredPin.length === 4) {
          setTimeout(verifyPin, 100);
        }
      }
    }

    function clearPin() {
      enteredPin = "";
      updatePinDots();
    }

    function backspacePin() {
      enteredPin = enteredPin.slice(0, -1);
      updatePinDots();
    }

    function updatePinDots() {
      const dots = document.getElementById('pinDots').children;
      for (let i = 0; i < 4; i++) {
        if (i < enteredPin.length) {
          dots[i].className = "w-3.5 h-3.5 rounded-full bg-blue-500 border border-blue-400 shadow scale-110 transition-all";
        } else {
          dots[i].className = "w-3.5 h-3.5 rounded-full border border-zinc-500 transition-all";
        }
      }
    }

    function verifyPin() {
      const savedPin = localStorage.getItem(PIN_KEY);
      if (enteredPin === savedPin) {
        document.getElementById('pinLockScreen').classList.add('hidden');
        enteredPin = "";
        updatePinDots();
        showToast("잠금이 해제되었습니다");
      } else {
        showToast("암호가 일치하지 않습니다");
        clearPin();
      }
    }

    function togglePinLockManual() {
      const savedPin = localStorage.getItem(PIN_KEY);
      if (!savedPin) {
        showToast("설정(우측 상단 톱니바퀴)에서 암호를 등록해주세요");
        return;
      }
      enteredPin = "";
      updatePinDots();
      document.getElementById('pinLockScreen').classList.remove('hidden');
    }

    function togglePinSetting() {
      const current = localStorage.getItem(PIN_KEY);
      if (current) {
        if (window.confirm("PIN 암호 잠금을 해제하시겠습니까?")) {
          localStorage.removeItem(PIN_KEY);
          showToast("암호 잠금이 해제되었습니다");
          updatePinSettingsButtonLabel();
        }
      } else {
        const newPin = window.prompt("새로운 4자리 숫자 암호를 입력하세요:");
        if (newPin && newPin.length === 4 && /^\d+$/.test(newPin)) {
          localStorage.setItem(PIN_KEY, newPin);
          showToast("PIN 잠금이 설정되었습니다");
          updatePinSettingsButtonLabel();
        } else if (newPin !== null) {
          showToast("4자리 숫자만 입력 가능합니다");
        }
      }
    }

    function updatePinSettingsButtonLabel() {
      const btn = document.getElementById('pinToggleStatusBtn');
      const isSet = !!localStorage.getItem(PIN_KEY);
      btn.textContent = isSet ? "잠금 해제" : "암호 등록";
      btn.className = isSet 
        ? "px-3 py-1.5 rounded-xl bg-rose-100 dark:bg-rose-950 text-rose-600 dark:text-rose-400 font-medium active:scale-95 transition" 
        : "px-3 py-1.5 rounded-xl bg-slate-200 dark:bg-zinc-700 font-medium active:scale-95 transition";
    }

    /* Settings and Backup Handlers */
    function openSettingsModal() { document.getElementById('settingsModal').classList.remove('hidden'); }
    function closeSettingsModal() { document.getElementById('settingsModal').classList.add('hidden'); }

    function exportBackupData() {
      if (posts.length === 0) {
        showToast("백업할 데이터가 없습니다");
        return;
      }
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(posts, null, 2));
      const downloadAnchor = document.createElement('a');
      const filename = `privatelog_backup_${new Date().toISOString().slice(0,10)}.json`;
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", filename);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      showToast("백업 파일이 생성되었습니다");
    }

    function importBackupData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            for (const item of imported) {
              if (item.id && item.createdAt) {
                await savePostToDB(item);
              }
            }
            posts = await fetchAllPostsFromDB();
            renderPosts();
            closeSettingsModal();
            showToast(`${imported.length}개의 기록을 복원했습니다`);
          } else {
            showToast("올바른 백업 파일 형식이 아닙니다");
          }
        } catch (err) {
          showToast("파일을 읽는 중 오류가 발생했습니다");
        }
      };
      reader.readAsText(file);
    }

    async function clearAllDataPrompt() {
      if (window.confirm("정말로 모든 기록을 삭제하시겠습니까? 복구할 수 없습니다.")) {
        const tx = db.transaction("posts", "readwrite");
        tx.objectStore("posts").clear();
        tx.oncomplete = async () => {
          posts = [];
          renderPosts();
          closeSettingsModal();
          showToast("모든 데이터가 초기화되었습니다");
        };
      }
    }

    function formatDate(isoStr) {
      const d = new Date(isoStr);
      return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    function formatDateShort(isoStr) {
      const d = new Date(isoStr);
      return `${d.getMonth() + 1}.${d.getDate()}`;
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 2000);
    }

    function escapeHtml(string) {
      return String(string)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function updateCharCount() {
      const len = document.getElementById('postContent').value.length;
      document.getElementById('charCount').textContent = `${len}자`;
    }

    function initTheme() {
      const saved = localStorage.getItem(THEME_KEY);
      if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
    }

    document.getElementById('postContent').addEventListener('input', updateCharCount);

    window.addEventListener('DOMContentLoaded', async () => {
      initTheme();
      checkPinOnLaunch();
      await initDB();
      posts = await fetchAllPostsFromDB();

      const savedView = localStorage.getItem(VIEW_KEY) || 'feed';
      setViewMode(savedView);
    });
  </script>
</body>
</html>
